<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DoT — Loading</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-user-select: none; user-select: none;
        -webkit-app-region: drag;
      }
      .card {
        width: 100%; height: 100%;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 22px;
        background: radial-gradient(ellipse at center, #0d1020 0%, #05060d 100%);
        border-radius: 18px;
        border: 1px solid rgba(124, 108, 248, 0.18);
        box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(139, 26, 26, 0.15);
        padding: 28px;
      }
      .brand {
        display: flex; align-items: center; gap: 12px;
        animation: fadeUp 0.45s ease both;
      }
      .brand-text {
        color: #eef0f8; font-weight: 800; font-size: 28px;
        letter-spacing: -0.8px; line-height: 1;
      }
      .brand-text .accent { color: #8B1A1A; }
      .spinner {
        width: 36px; height: 36px;
        border: 2.5px solid rgba(124,108,248,0.15);
        border-top-color: #a5a8ff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      .status {
        color: #8892b0; font-size: 12px;
        letter-spacing: 0.6px; text-transform: uppercase;
        font-weight: 600;
        animation: fadeUp 0.45s 0.15s ease both;
      }
      .sub {
        color: #4a526e; font-size: 10.5px;
        letter-spacing: 0.4px;
        animation: fadeUp 0.45s 0.25s ease both;
      }
      @keyframes spin   { to { transform: rotate(360deg); } }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <svg width="64" height="48" viewBox="0 0 48 36" fill="none">
          <circle cx="14" cy="20" r="12" fill="#8B1A1A" />
          <circle cx="33" cy="10" r="7.5" fill="#8B1A1A" />
          <circle cx="40" cy="25" r="4.5" fill="#8B1A1A" />
        </svg>
        <div class="brand-text">Do<span class="accent">T</span></div>
      </div>
      <div class="spinner"></div>
      <div class="status">Initialising secure workspace</div>
      <div class="sub">Loading AdsPower environment…</div>
    </div>
  </body>
</html>
